
name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: 1114656
          outputs: |
            dist/github-snake.svg?color_snake=#10B981&color_dots=#F0FDF4,#DCFCE7,#BBF7D0,#86EFAC,#22C55E
            dist/github-snake-dark.svg?color_snake=#10B981&color_dots=#161B22,#14532D,#166534,#15803D,#4ADE80

      - name: Publish snake
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
