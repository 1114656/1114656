
name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: 1114656
          outputs: |
            dist/github-snake.svg?color_snake=%2310B981&color_dots=%23F0FDF4,%23DCFCE7,%23BBF7D0,%2386EFAC,%2322C55E
            dist/github-snake-dark.svg?color_snake=%2310B981&color_dots=%23161B22,%2314532D,%23166534,%2315803D,%234ADE80

      - name: Publish snake
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
